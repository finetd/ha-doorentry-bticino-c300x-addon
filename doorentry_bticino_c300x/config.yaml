name: "Door Entry BTicino C300X"
description: >-
  Rileva lo squillo del videocitofono BTicino/Legrand Classe 300X (app Door Entry) e cattura
  uno screenshot. Inserisci solo email e password dell'app Door Entry: l'add-on crea da solo
  l'interno dedicato, i certificati e la configurazione. Senza root, senza firmware modificato.
version: "1.14.0-exp"
slug: doorentry_bticino_c300x
init: false
arch:
  - aarch64
  - amd64
map:
  - share:rw
options:
  email: ""
  password: ""
  device_name: "Home Assistant"
  snapshot_path: "/share/doorentry_bticino_c300x/doorbell.jpg"
  ha_event: "doorentry_bticino_c300x_ring"
  snapshot_delay: 2.0
  capture_mode: "notify_only"
  fallback_delay: 20
  http_port: 8099
  webhook_id: "doorentry_bticino_c300x"
  ha_base_url: "http://homeassistant:8123"
schema:
  email: str
  password: password
  device_name: str
  snapshot_path: str
  ha_event: str
  snapshot_delay: float
  capture_mode: "list(notify_only|fallback_snapshot)"
  fallback_delay: int
  http_port: port
  webhook_id: str?
  ha_base_url: str?
auth_api: true
hassio_api: true
homeassistant_api: true
# fa comparire il pulsante "Visita" con l'URL corretto (IP di HA, non il nome interno)
webui: "http://[HOST]:[PORT:8099]/"
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "Comandi e info per Home Assistant (/info, /cmd/...)"
